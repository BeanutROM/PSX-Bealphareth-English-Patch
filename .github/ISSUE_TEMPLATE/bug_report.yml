name: Bug report
description: Report a problem with a game translation or patch.
title: "[Bug]: "
body:
  - type: input
    id: patch-version
    attributes:
      label: Patch version
      description: Enter the version of the patch
      placeholder: "e.g. v1.2, Beta v0.9"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Describe what is wrong, and if applicable, what you expected to happen.
      placeholder: Describe the issue, including any relevant dialogue, scene, or menu.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where are you running the game?
      options:
        - Duckstation
        - MiSTer FPGA PSX core
        - Original hardware
    validations:
      required: true

  - type: input
    id: emulator-version
    attributes:
      label: Emulator version or MiSTer PSX core date
      description: >-
        Give the emulator name and exact version, or the MiSTer FPGA PSX core
        build date (YYYY-MM-DD). If using original hardware, enter the model.
        Do not report issues with emulators other than Duckstation. Use Duckstation.
        Leave blank when using Original Hardware.
      placeholder: "e.g. DuckStation 0.1-xxxx, MiSTer PSX 2026-11-13, SCPH-xxxx"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (if applicable)
      description: Describe how to reach the issue if you can reproduce it.
      placeholder: |
        1. Load the attached save or savestate.
        2. ...
        3. Observe the issue.
    validations:
      required: false

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot (required)
      description: Upload at least one screenshot showing the problem.
    validations:
      required: true
      accept: ".png,.jpg,.jpeg,.webp,.gif"

  - type: upload
    id: save-file
    attributes:
      label: Savestate or save game (required)
      description: >-
        Upload a ZIP containing a savestate or save game that helps reproduce
        the issue. Include the emulator/core name in the archive filename if useful.
        Do not upload game ROMs, disc images, or personal files.
    validations:
      required: true
      accept: ".zip"
